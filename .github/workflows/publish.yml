name: Publish MMA dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/**', 'qa/**', 'scripts/**', 'templates/**', 'tracker.config.json', 'package*.json', 'collector/**', '.github/workflows/publish.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mma-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check calculations and collection parser
        run: npm test
      - name: Install browser test dependency
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright/cli.js install chromium --with-deps
      - name: Check desktop and mobile interactions
        run: npm run test:ui
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Verify deployed site and direct Melon access
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node qa/live_probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-checks
          path: qa-output
          retention-days: 3
