name: Collect MMA TOP6 votes
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Collector start reason'
        required: false
        default: 'manual'
  push:
    branches: [main]
    paths: ['collector/**', 'tracker.config.json', 'dist/config.js', 'dist/gap-model.js', 'dist/gap-selector.js', 'dist/gap-candidates.js', '.github/workflows/collect.yml']
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: mma-collector
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect and prepare successor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python collector/collect.py --loop

